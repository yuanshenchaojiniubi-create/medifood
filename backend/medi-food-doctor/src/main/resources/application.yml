server:
  port: 8209

spring:
  application:
    name: medi-food-doctor

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medifood_circle?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # Nacos 配置
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: 82f923d0-7b52-403f-a440-1c61b5ea4fea
        group: DEFAULT_GROUP
    # ========== Sentinel 熔断限流配置 ==========
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8858
        port: 8726
      eager: true
    openfeign:
      sentinel:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

  # Redis 配置
  data:
    redis:
      host: localhost
      password:
      database: 0
      port: 6379
      timeout: 5000ms

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.medifood: debug
    org.springframework: info