server:
  port: 8088

spring:
  application:
    name: medi-food-message

  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: 82f923d0-7b52-403f-a440-1c61b5ea4fea
        group: DEFAULT_GROUP
    # ========== Sentinel 熔断限流配置 ==========
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8858
        port: 8727
      eager: true
    openfeign:
      sentinel:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medifood_circle?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall,log4j2
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

oss:
  bucket: medifood
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  upload:
    dir: upload
    expire-time: 3600